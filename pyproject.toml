[project]
name = "tripwire"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "eero-api>=8.0.6",
    "mcp>=2.3.0",
]

[project.scripts]
tripwire = "tripwire.cli:main"
tripwire-mcp = "tripwire.mcp_server:main"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripwire"]
